project_shape:
  scale: sprawling
  has_subsystem_layer: true
  expected_modules: "20-30"
  kind: product

modules:
  - id: project-manager-v2.domain-models.domain-model-and-rules
    project: ProjectManagerV2
    subsystem: Domain Models
    name: Domain model and rules
    capability: Models projects, hierarchy items, sessions, and the core business rules around focus, validation, and session state.
    status: mature
    approach: Uses Swift value types, enums, computed extensions, and pure rule helpers like FocusManager and SessionStateMachine inside PMDomain.
    tech: [Swift, Foundation]
    io: { in: "Repository records and UI/service inputs", out: "Typed entities, enums, and business-rule decisions" }
    code_refs: ["Packages/PMDomain/Sources/PMDomain/Entities/**", "Packages/PMDomain/Sources/PMDomain/Enums/**", "Packages/PMDomain/Sources/PMDomain/Logic/**", "Packages/PMDomain/Sources/PMDomain/Protocols/**"]
    known_gaps: []
    match_keywords: [domain model, workflow rules, focus management, session state machine, project hierarchy]

  - id: project-manager-v2.data-persistence.sqlite-data-store
    project: ProjectManagerV2
    subsystem: Data Persistence
    name: SQLite data store
    capability: Persists the full project hierarchy, documents, conversations, sessions, and supporting records in a local SQLite database.
    status: mature
    approach: Wraps GRDB DatabaseQueue migrations plus per-entity SQLite repository implementations behind domain repository protocols.
    tech: [Swift, GRDB, SQLite]
    io: { in: "Domain entities and repository queries", out: "Stored rows, fetched entities, FTS-backed document search index" }
    code_refs: ["Packages/PMData/Sources/PMData/DatabaseManager.swift", "Packages/PMData/Sources/PMData/Repositories/*.swift", "Packages/PMData/Sources/PMData/Records/*.swift"]
    known_gaps: []
    match_keywords: [sqlite repository, grdb persistence, local database, migrations, repository layer]

  - id: project-manager-v2.data-export-import.data-portability
    project: ProjectManagerV2
    subsystem: Data Export/Import
    name: Data portability
    capability: Exports and re-imports complete project data snapshots including hierarchy, documents, conversations, sessions, and codebase metadata.
    status: working
    approach: Builds Codable JSON payloads from GRDB reads and merges imports by UUID back into the database.
    tech: [Swift, GRDB, JSONEncoder, JSONDecoder]
    io: { in: "Database state or exported JSON", out: "Portable JSON snapshots or merged database updates" }
    code_refs: ["Packages/PMData/Sources/PMData/Export/DataExporter.swift", "Packages/PMData/Sources/PMData/Export/DataImporter.swift"]
    known_gaps: ["Single-project export currently includes all dependencies rather than filtering them to the selected project's hierarchy."]
    match_keywords: [data export, data import, backup restore, json snapshot, migration payload]

