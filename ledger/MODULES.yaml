    project: ProjectManagerV2
    subsystem: CloudKit Sync
    name: CloudKit sync engine
    capability: Tracks local entity changes, pushes them to CloudKit, pulls remote updates back, and resolves simple conflicts.
    status: partial
    approach: Uses a SyncEngine actor with a SQLite-backed change queue, CloudKit backend, serialized payload provider, and timestamp-based conflict resolver.
    tech: [Swift, CloudKit, GRDB, UserDefaults]
    io: { in: "Tracked entity changes and remote CloudKit deltas", out: "Synced remote records, applied local updates, persisted sync tokens" }
    code_refs: ["Packages/PMData/Sources/PMData/Sync/*.swift", "Packages/PMFeatures/Sources/PMFeatures/Sync/SyncManager.swift", "ProjectManager/Sources/ContentView.swift", "ProjectManageriOS/Sources/iOSContentView.swift"]
    known_gaps: ["ledger/PROJECT.md still lists real-world multi-device sync as an open question.", "Manual merge conflicts are logged and skipped rather than resolved in-product."]
    match_keywords: [cloudkit sync, offline sync, conflict resolution, change queue, bidirectional sync]

